<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil &middot; {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1 class="app-name">{{ app_name }}</h1>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>Editar perfil</h2>

            {% if error_message %}
            <div class="alert alert-error" role="alert">{{ error_message }}</div>
            {% endif %}

            <form action="{{ url_for('save') }}" method="post" enctype="multipart/form-data">
                <div class="field">
                    <label for="name">Nome <span class="required">*</span></label>
                    <input type="text" id="name" name="name" value="{{ profile.name or '' }}" required>
                </div>

                <div class="field">
                    <label for="email">E-mail <span class="required">*</span></label>
                    <input type="email" id="email" name="email" value="{{ profile.email or '' }}" required>
                </div>

                <div class="field">
                    <label for="profession">Profissao</label>
                    <input type="text" id="profession" name="profession" value="{{ profile.profession or '' }}">
                </div>

                <div class="field">
                    <label for="city">Cidade</label>
                    <input type="text" id="city" name="city" value="{{ profile.city or '' }}">
                </div>

                <div class="field">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="3">{{ profile.bio or '' }}</textarea>
                </div>

                <div class="field">
                    <label for="interests">Interesses <small>(separados por virgula)</small></label>
                    <input type="text" id="interests" name="interests" value="{{ interests_text }}">
                </div>

                <div class="field">
                    <label for="photo">Foto <small>(JPEG ou PNG)</small></label>
                    <input type="file" id="photo" name="photo" accept="image/jpeg,image/png">
                    <div class="photo-preview-wrapper">
                        <img id="photo-preview" class="photo-preview" alt="Pre-visualizacao da foto" hidden>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a class="btn btn-secondary" href="{{ url_for('home') }}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <small>Laboratorio AWS VPC Endpoints</small>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
